[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that exercise multiple modules / mocked externals",
    "smoke: startup sanity checks",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:discord.client",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B105"]